{{ template "base.html" }}

{{ define body }}
<header>
{{ template "pagenav.html" }}
</header>
<main>
  <header>
    <span class="post-date">{{ date_long }}</span>
    <h1 class="post-title">{{ title }}</h1>
    <p class="post-subtitle">{{ subtitle }}</p>
  </header>
{{ post_content }}
</main>
<footer>
{{ template "pagenav.html" }}
</footer>
{{ if has_footnotes }}
<script src="/footnote.js"></script>
{{ end }}
{{ end }}
